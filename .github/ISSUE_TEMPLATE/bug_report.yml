name: Bug report
description: Something does not work as documented.
title: "[bug] "
labels: []
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: The repository this concerns (for example omega-mv), or "unknown".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The steps, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser, OS, versions. Do not include passwords, keys, emails or phone numbers.
