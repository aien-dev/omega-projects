name: Feature request
description: Ask for something new in Omega, a project or one of Drake's repositories.
title: "[feature] "
labels: []
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: The repository this concerns (for example omega-mv), or "unknown".
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you want
      description: What should be possible, and why it matters to you.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything else that helps. Do not include passwords, keys, emails or phone numbers.
